# A Claude review on every push to a pull request, in any repo of any silo (Silos ADR-019).
# Called from a short workflow in each repo (see README). Runs on that repo's GitHub runners, posts with that
# workflow's GITHUB_TOKEN, and reaches Claude through Claude Console workload identity federation: no stored key.
# The review command is installed from this repo at the same commit as this workflow, which GitHub reports in the
# run's identity token, so a caller pins one commit in one place.
name: review

on:
  workflow_call:
    inputs:
      federation_rule_id:
        description: "Claude Console federation rule for this repo (fdrl_...); an identifier, not a secret."
        type: string
        required: true
      service_account_id:
        type: string
        required: true
      organization_id:
        type: string
        required: true
      model:
        description: "Optional model for the review (Claude Code's default when empty)."
        type: string
        default: ""
      show_full_output:
        description: "Print the review's full conversation in the run log, for diagnosing a run. Leave off."
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write  # the GitHub OIDC token: names this workflow's commit, and federation exchanges it for Claude access

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Which recipe commit is this
        id: recipe
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("review-recipe");
            const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
            if (!String(claims.job_workflow_ref || "").startsWith("Silos-Group/review-recipe/")) {
              core.setFailed(`unexpected workflow ${claims.job_workflow_ref}`);
            }
            core.setOutput("sha", claims.job_workflow_sha);

      - uses: actions/checkout@v4
        with:
          repository: Silos-Group/review-recipe
          ref: ${{ steps.recipe.outputs.sha }}
          path: .review-recipe
          persist-credentials: false

      - name: Move the recipe out of the reviewed repo
        run: mv .review-recipe "$RUNNER_TEMP/review-recipe"

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc  # v1.0.248
        with:
          anthropic_federation_rule_id: ${{ inputs.federation_rule_id }}
          anthropic_service_account_id: ${{ inputs.service_account_id }}
          anthropic_organization_id: ${{ inputs.organization_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: ${{ inputs.show_full_output }}
          plugin_marketplaces: ${{ runner.temp }}/review-recipe
          plugins: silos-review@silos-review-recipe
          prompt: "/silos-review:review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --head ${{ github.event.pull_request.head.sha }}"
          # A HIPAA-configured Claude org rejects beta features such as context_management; sub-reviewers must run in
          # the foreground, or the job ends before they report and nothing is posted (review-standard §6).
          settings: '{"env": {"CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS": "1", "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          # Only reads and comment posting. No `gh api`: it accepts write methods, and the model reads untrusted PR
          # text, so an injected instruction could approve or edit pull requests or delete comments.
          claude_args: >-
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
