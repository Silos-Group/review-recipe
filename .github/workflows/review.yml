# A Claude review on every push to a pull request, in any repo of any silo (Silos ADR-019).
# Called from a short workflow in each repo (see README). Runs on that repo's GitHub runners, posts with that
# workflow's GITHUB_TOKEN, and reaches Claude through Claude Console workload identity federation: no stored key.
# The review command comes from this repo at the ref the caller pins, so a caller only changes when it moves its pin.
name: review

on:
  workflow_call:
    inputs:
      recipe_ref:
        description: "Commit or tag of Silos-Group/review-recipe to take the review command from (pin it)."
        type: string
        required: true
      federation_rule_id:
        description: "Claude Console federation rule for this repo (fdrl_...); an identifier, not a secret."
        type: string
        required: true
      service_account_id:
        type: string
        required: true
      organization_id:
        type: string
        required: true
      model:
        description: "Optional model for the review (Claude Code's default when empty)."
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write  # the GitHub OIDC token that federation exchanges for a short-lived Claude token

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Silos-Group/review-recipe
          ref: ${{ inputs.recipe_ref }}
          path: .review-recipe
          persist-credentials: false

      - name: Install the review command
        run: |
          mkdir -p .claude/commands
          cp .review-recipe/plugins/silos-review/commands/review.md .claude/commands/silos-review.md

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc  # v1.0.248
        with:
          anthropic_federation_rule_id: ${{ inputs.federation_rule_id }}
          anthropic_service_account_id: ${{ inputs.service_account_id }}
          anthropic_organization_id: ${{ inputs.organization_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/silos-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --head ${{ github.event.pull_request.head.sha }}"
          # A HIPAA-configured Claude org rejects beta features such as context_management; sub-reviewers must run in
          # the foreground, or the job ends before they report and nothing is posted (review-standard §6).
          settings: '{"env": {"CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS": "1", "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          # The command's own allowed-tools header is not honoured for a project command, so the same tools are
          # granted here: read-only gh calls, posting the summary, reading earlier review comments, inline comments.
          claude_args: >-
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api repos:*),mcp__github_inline_comment__create_inline_comment"
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
